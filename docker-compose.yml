# One command to run SpeedReader and its database:
#   docker compose up --build
# Then open http://localhost:3000
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: speedread
      POSTGRES_PASSWORD: speedread   # local use only; change it if the port is ever exposed
      POSTGRES_DB: speedread
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U speedread -d speedread"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: speedreader:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://speedread:speedread@db:5432/speedread?schema=public
      BOOKS_STORAGE_PATH: /mnt/books
      NEXTAUTH_URL: http://localhost:3000
    volumes:
      - books:/mnt/books
    ports:
      # Bound to this machine only, because the app has no login.
      # Do not change to 0.0.0.0 unless something else (VPN, proxy login) protects it.
      - "127.0.0.1:3000:3000"

volumes:
  pgdata:
  books:
